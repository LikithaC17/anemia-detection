{% extends "base.html" %}

{% block title %}Error {{ error_code }} - Anemia Detection AI{% endblock %}

{% block content %}
<div class="card" style="max-width: 650px; margin: 3rem auto; text-align: center; padding: 2.5rem 2rem;">
  <div style="font-size: 3.5rem; margin-bottom: 0.75rem;">⚠️</div>
  <h2 style="font-size: 1.8rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem;">
    Error {{ error_code }}: {{ error_title }}
  </h2>
  <p style="font-size: 0.95rem; color: var(--slate-500); margin-bottom: 1.75rem; line-height: 1.6;">
    {{ error_message }}
  </p>
  <div style="display: flex; gap: 0.75rem; justify-content: center;">
    <a href="{{ url_for('prediction') }}" class="btn btn-primary">Try Prediction Again</a>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Return to Home</a>
  </div>
</div>
{% endblock %}
